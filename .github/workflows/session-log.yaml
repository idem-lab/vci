# Advisory reminder that a pull request carries a Claude Code session log.
#
# The prompts behind an agent-produced change are meant to travel with the
# change (see README, "The role of AI in this package"). The per-branch Stop
# hook writes a branch's log at the end of a turn, so a PR opened during the
# turn that created its branch has no log yet; the log lands a commit later.
# This check therefore only *warns* when a log is missing — it does not fail —
# so it does not go red on every single-turn PR (see #52).
#
# Human-authored PRs have no session log. Add the `no-session-log` label to
# skip the check entirely, which makes "this was written by a person" an
# explicit, visible claim rather than a silent absence.

name: session-log

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]

jobs:
  session-log:
    runs-on: ubuntu-latest
    if: "!contains(github.event.pull_request.labels.*.name, 'no-session-log')"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for a session log
        run: |
          base="origin/${{ github.base_ref }}"
          if git diff --name-only --diff-filter=AM "$base...HEAD" \
            | grep -qE '^dev/sessions/.+\.md$'; then
            echo "Session log present."
          else
            echo "::warning::No session log in dev/sessions/ yet."
            echo "The per-branch Stop hook commits it at the end of the turn;"
            echo "commit it before marking the PR ready. Advisory only — see #52."
          fi
